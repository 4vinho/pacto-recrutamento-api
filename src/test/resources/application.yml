spring:
  datasource:
    url: jdbc:h2:mem:recrutamento;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 1025

server:
  port: 0

storage:
  minio:
    endpoint: http://localhost:9000
    access-key: test
    secret-key: test
    bucket: test

security:
  jwt:
    secret: uma-chave-de-teste-com-pelo-menos-trinta-e-dois-bytes

notification:
  mail:
    from: nao-responda@pacto.local
    password-reset-url: http://localhost:3000/redefinir-senha
  retry:
    delay-ms: 60000
    max-attempts: 5
