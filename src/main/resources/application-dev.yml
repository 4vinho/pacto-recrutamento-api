spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:recrutamento}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  flyway:
    locations: classpath:db/migration,classpath:db/dev

server:
  port: ${SERVER_PORT:8080}

storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    region: ${MINIO_REGION:us-east-1}
    access-key: ${MINIO_ROOT_USER:minioadmin}
    secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
    bucket: ${MINIO_BUCKET:curriculos}

security:
  jwt:
    secret: ${JWT_SECRET:chave-local-de-desenvolvimento-com-32-bytes}
