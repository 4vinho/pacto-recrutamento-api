spring:
  application:
    name: recrutamento-api
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

server:
  port: ${SERVER_PORT}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    br.com.pacto.recrutamento: ${LOG_LEVEL_APP:INFO}
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] requestId=%X{requestId:-none} %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

storage:
  minio:
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET}

security:
  jwt:
    secret: ${JWT_SECRET}

notification:
  mail:
    from: ${MAIL_FROM:nao-responda@pacto.local}
    password-reset-url: ${PASSWORD_RESET_URL:http://localhost:4200/auth/redefinir-senha}
  retry:
    delay-ms: ${NOTIFICATION_RETRY_DELAY_MS:60000}
    max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:5}
